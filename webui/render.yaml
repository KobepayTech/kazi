# One-click deploy config for Render (https://render.com).
# In the Render dashboard: New > Blueprint, point at this repo, set rootDir to webui.
# Then add ANTHROPIC_API_KEY as a secret env var (it is intentionally not in this file).
services:
  - type: web
    name: ai-job-search-webui
    runtime: node
    rootDir: webui
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-5
      - key: RATE_MAX
        value: "20"
