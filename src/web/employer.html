<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment page - powered by KobeOS</title>
<style>
  :root { --ink:#10211a; --muted:#5b6f66; --line:#d8e4dd; --bg:#f4f8f5; --green:#0f7a4f; --amber:#a86a10; --red:#b3372b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#0d3b2a; color:#fff; padding:20px 24px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1120px; margin:0 auto; padding:24px 20px 64px; display:grid; gap:20px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .signin { max-width:380px; margin:48px auto; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; background:#fff; }
  button { font:inherit; font-weight:600; cursor:pointer; border-radius:8px; border:1px solid transparent; padding:8px 13px; font-size:14px; }
  .primary { background:var(--green); color:#fff; }
  .ghost { background:#fff; border-color:var(--line); }
  .danger { background:#fff; border-color:#f0c2bc; color:var(--red); }
  .tiles { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .tile { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tile span { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .filters { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); align-items:end; }
  .applicant { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background:#fff; }
  .applicant h3 { margin:0 0 2px; font-size:17px; }
  .applicant .meta { color:var(--muted); font-size:13px; margin:0 0 10px; }
  .facts { display:grid; gap:4px 16px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); font-size:14px; margin-bottom:10px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { font-size:12px; padding:2px 9px; border-radius:999px; background:#e7f0ea; color:var(--green); white-space:nowrap; }
  .score { float:right; font-weight:700; color:var(--green); }
  .notice { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:12px; }
  .ok { background:#e6f4ec; border:1px solid #b7dfc8; }
  .err { background:#fbeae8; border:1px solid #f0c2bc; }
  .vacancy-row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap; }
  .live { font-size:12px; color:var(--muted); }
  .live b { color:var(--green); }
</style>
</head>
<body>
<header>
  <h1 id="clientName">Recruitment page</h1>
  <p>Candidates arrive here the moment they apply through Soko Huru.</p>
</header>

<main>
  <div id="status"></div>

  <section class="panel signin" id="signin">
    <h2>Sign in</h2>
    <p style="color:#5b6f66;font-size:13px;margin:0">Use the access code Soko Huru sent you.</p>
    <label for="kind">Access type</label>
    <select id="kind">
      <option value="one_time_code">One-time access code</option>
      <option value="password">Password</option>
      <option value="email_otp">Email OTP</option>
      <option value="phone_otp">Phone OTP</option>
    </select>
    <label for="secret">Code</label>
    <input id="secret" type="password" autocomplete="one-time-code">
    <button class="primary" id="signinBtn" style="width:100%;margin-top:12px">Open my recruitment page</button>
  </section>

  <div id="portal" hidden>
    <section class="panel">
      <h2>Positions <span class="live" id="live"></span></h2>
      <div class="tiles" id="tiles"></div>
      <div id="vacancies"></div>
    </section>

    <section class="panel">
      <h2>Applicants</h2>
      <div class="filters">
        <div><label for="fVacancy">Vacancy</label><select id="fVacancy"><option value="">All</option></select></div>
        <div><label for="fStatus">Status</label><select id="fStatus">
          <option value="">All</option><option value="applied">New</option><option value="viewed">Viewed</option>
          <option value="shortlisted">Shortlisted</option><option value="interview_invited">Interview invited</option>
          <option value="interview_completed">Interview completed</option><option value="hired">Hired</option>
          <option value="rejected">Rejected</option></select></div>
        <div><label for="fLocation">Location</label><input id="fLocation" placeholder="Dar es Salaam"></div>
        <div><label for="fExperience">Min experience</label><input id="fExperience" type="number" min="0" placeholder="2"></div>
        <div><label for="fLanguage">Language</label><input id="fLanguage" placeholder="English"></div>
        <div><label for="fSearch">Search</label><input id="fSearch" placeholder="name, skill or reference"></div>
        <div><button class="ghost" id="applyFilters" style="width:100%">Filter</button></div>
      </div>
      <div id="applicants" style="margin-top:16px"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const slug = location.pathname.split('/')[2] || '';
const jobSlug = location.pathname.split('/')[4] || '';
let token = sessionStorage.getItem(`kobeos_employer_${slug}`) || '';
let dashboard = null;

function escape(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function notice(kind, text) {
  $('status').innerHTML = `<div class="notice ${kind}">${text}</div>`;
  setTimeout(() => { if ($('status').textContent.includes(text.replace(/<[^>]+>/g, '').slice(0, 20))) $('status').innerHTML = ''; }, 6000);
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', authorization: `Bearer ${token}`, ...(options.headers || {}) },
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data?.error?.message || `Request failed (${response.status})`);
  return data;
}

async function loadClientName() {
  try {
    const client = await fetch(`/api/client/${encodeURIComponent(slug)}`).then((r) => r.json());
    if (client.name) $('clientName').textContent = `${client.name} - recruitment page`;
  } catch { /* portal shows its generic title */ }
}

function renderDashboard(data) {
  dashboard = data;
  const t = data.totals;
  $('tiles').innerHTML = [
    ['Positions', t.positions], ['Applications', t.applications], ['New', t.newApplications],
    ['Shortlisted', t.shortlisted], ['Interviews', t.interviewInvited], ['Hired', t.hired],
    ['Remaining', t.remainingPositions],
  ].map(([label, value]) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`).join('');

  $('vacancies').innerHTML = data.vacancies.map((v) => `
    <div class="vacancy-row">
      <div><strong>${escape(v.title)}</strong> - ${escape(v.location)}<br>
        <small style="color:#5b6f66">${v.applications} applications · ${v.newApplications} new · ${v.viewed} viewed ·
        ${v.shortlisted} shortlisted · ${v.interviewInvited} invited · ${v.rejected} rejected ·
        ${v.hired} hired · ${v.remainingPositions} of ${v.positions} positions left</small></div>
      <div class="actions">
        <button class="ghost" data-more="${escape(v.vacancyId)}">Request more candidates</button>
        <button class="danger" data-close="${escape(v.vacancyId)}">Close vacancy</button>
      </div>
    </div>`).join('');

  const select = $('fVacancy');
  const current = select.value;
  select.innerHTML = '<option value="">All</option>' +
    data.vacancies.map((v) => `<option value="${escape(v.vacancyId)}">${escape(v.title)}</option>`).join('');
  select.value = current;

  $('vacancies').querySelectorAll('button[data-close]').forEach((button) => {
    button.addEventListener('click', async () => {
      if (!confirm('Close this vacancy? Applicants will stop seeing it.')) return;
      try { await api(`/api/employer/vacancies/${button.dataset.close}/close`, { method: 'POST' });
        notice('ok', 'Vacancy closed.'); await refresh(); } catch (e) { notice('err', escape(e.message)); }
    });
  });
  $('vacancies').querySelectorAll('button[data-more]').forEach((button) => {
    button.addEventListener('click', async () => {
      const message = prompt('Anything to tell Soko Huru?') || null;
      try { await api(`/api/employer/vacancies/${button.dataset.more}/request-more`, { method: 'POST', body: JSON.stringify({ message }) });
        notice('ok', 'Soko Huru has been asked for more candidates.'); } catch (e) { notice('err', escape(e.message)); }
    });
  });
}

function filterQuery() {
  const params = new URLSearchParams();
  const map = { vacancyId: 'fVacancy', status: 'fStatus', location: 'fLocation', minExperienceYears: 'fExperience',
                language: 'fLanguage', search: 'fSearch' };
  for (const [key, id] of Object.entries(map)) {
    const value = $(id).value.trim();
    if (value) params.set(key, value);
  }
  return params;
}

const NEXT_ACTIONS = {
  applied: ['shortlisted', 'rejected'],
  viewed: ['shortlisted', 'rejected'],
  shortlisted: ['interview_invited', 'rejected'],
  interview_invited: ['interview_completed', 'rejected'],
  interview_completed: ['hired', 'rejected'],
  hired: [], rejected: [], withdrawn: [],
};
const LABELS = { shortlisted:'Shortlist', rejected:'Reject', interview_invited:'Invite to interview',
                 interview_completed:'Interview done', hired:'Mark hired' };

async function loadApplicants() {
  const params = filterQuery();
  const data = await api(`/api/employer/applications?${params.toString()}`);
  $('applicants').innerHTML = data.applications.length === 0
    ? '<p style="color:#5b6f66">No applicants match these filters yet.</p>'
    : data.applications.map((entry) => {
        const a = entry.applicant, cv = entry.cv, app = entry.application;
        const actions = (NEXT_ACTIONS[app.status] || []).map((next) =>
          `<button class="${next === 'rejected' ? 'danger' : 'primary'}" data-id="${escape(app.id)}" data-next="${next}">${LABELS[next]}</button>`).join('');
        return `<div class="applicant">
          <span class="score">${app.matchScore}%</span>
          <h3>${escape(a.fullName)}</h3>
          <p class="meta">${escape(a.location)} · ${escape(entry.vacancyTitle)} · ${escape(app.reference)}
            <span class="tag">${escape(entry.statusLabel)}</span></p>
          <div class="facts">
            <div><strong>${cv.experienceYears}</strong> years experience</div>
            <div>${escape(cv.educationLevel)}</div>
            <div>${escape((cv.languages || []).join(', ') || '-')}</div>
            <div>${a.willingToRelocate ? 'Willing to relocate' : 'Prefers home area'}</div>
            <div>${a.availableFrom ? 'Available ' + escape(a.availableFrom) : 'Available immediately'}</div>
            <div>${a.sokoHuruVerified ? 'Soko Huru verified' : 'Not yet verified'}</div>
          </div>
          <p style="font-size:14px;margin:0 0 10px">${escape(cv.headline || '')}
            ${(cv.certificates || []).length ? '<br><small>Certificates: ' + escape(cv.certificates.join(', ')) + '</small>' : ''}
            ${(cv.skills || []).length ? '<br><small>Skills: ' + escape(cv.skills.join(', ')) + '</small>' : ''}</p>
          <div class="actions">
            <button class="ghost" data-open="${escape(app.id)}">View CV</button>
            <button class="ghost" data-note="${escape(app.id)}">Add note</button>
            ${actions}
          </div>
          ${app.employerNotes ? `<p style="font-size:13px;color:#5b6f66;margin:10px 0 0">Note: ${escape(app.employerNotes)}</p>` : ''}
        </div>`;
      }).join('');

  $('applicants').querySelectorAll('button[data-next]').forEach((button) => {
    button.addEventListener('click', async () => {
      const next = button.dataset.next;
      const body = { status: next };
      if (next === 'interview_invited') {
        const when = prompt('Interview date and time (e.g. 2026-08-20 10:00)');
        if (when) body.interviewAt = new Date(when.replace(' ', 'T')).toISOString();
      }
      try {
        await api(`/api/employer/applications/${button.dataset.id}/status`, { method: 'POST', body: JSON.stringify(body) });
        notice('ok', 'Candidate updated.');
        await refresh();
      } catch (error) { notice('err', escape(error.message)); }
    });
  });

  $('applicants').querySelectorAll('button[data-open]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        const dossier = await api(`/api/employer/applications/${button.dataset.open}`);
        const cv = dossier.cv;
        alert([`${dossier.applicant.fullName} - ${cv.label}`, '',
          cv.headline || '', `Experience: ${cv.experienceYears} years`,
          `Education: ${cv.educationLevel}`, `Skills: ${(cv.skills || []).join(', ') || '-'}`,
          `Certificates: ${(cv.certificates || []).join(', ') || '-'}`,
          `Languages: ${(cv.languages || []).join(', ') || '-'}`,
          `Preferred salary: ${cv.preferredSalaryTzs ? 'TSh ' + cv.preferredSalaryTzs.toLocaleString() : 'not stated'}`,
          `Applied: ${new Date(dossier.application.createdAt).toLocaleString()}`,
          cv.filePath ? `File: ${cv.filePath}` : ''].join('\n'));
        await refresh();
      } catch (error) { notice('err', escape(error.message)); }
    });
  });

  $('applicants').querySelectorAll('button[data-note]').forEach((button) => {
    button.addEventListener('click', async () => {
      const note = prompt('Internal note (only your team sees this)');
      if (!note) return;
      try { await api(`/api/employer/applications/${button.dataset.note}/notes`, { method: 'POST', body: JSON.stringify({ note }) });
        notice('ok', 'Note saved.'); await loadApplicants(); } catch (e) { notice('err', escape(e.message)); }
    });
  });
}

async function refresh() {
  renderDashboard(await api('/api/employer/dashboard'));
  await loadApplicants();
}

function listen() {
  const source = new EventSource(`/api/employer/stream?token=${encodeURIComponent(token)}`);
  source.onopen = () => { $('live').innerHTML = '<b>live</b>'; };
  source.onerror = () => { $('live').textContent = 'reconnecting...'; };
  for (const type of ['application_received', 'application_status_changed', 'vacancy_published', 'vacancy_closed']) {
    source.addEventListener(type, (event) => {
      const payload = JSON.parse(event.data);
      if (type === 'application_received') notice('ok', `New application from ${escape(payload.applicantName)} for ${escape(payload.vacancyTitle)}.`);
      void refresh();
    });
  }
}

async function open() {
  try {
    $('signin').hidden = true;
    $('portal').hidden = false;
    if (jobSlug) {
      const data = await api('/api/employer/dashboard');
      const match = data.vacancies.find((v) => v.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') === jobSlug);
      if (match) $('fVacancy').innerHTML = `<option value="${match.vacancyId}">${match.title}</option>`;
    }
    await refresh();
    listen();
  } catch (error) {
    $('signin').hidden = false;
    $('portal').hidden = true;
    notice('err', escape(error.message));
  }
}

$('signinBtn').addEventListener('click', async () => {
  try {
    const session = await fetch('/api/employer/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slug, kind: $('kind').value, secret: $('secret').value }),
    }).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message || 'Sign in failed'); return d; });
    token = session.token;
    sessionStorage.setItem(`kobeos_employer_${slug}`, token);
    $('secret').value = '';
    await open();
  } catch (error) { notice('err', escape(error.message)); }
});

void loadClientName();
if (token) void open();
</script>
</body>
</html>
