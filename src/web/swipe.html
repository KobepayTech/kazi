<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jobs</title>
<style>
  :root { --ink:#10211a; --muted:#5b6f66; --line:#dde7e2; --bg:#f2f7f4; --green:#0f7a4f;
          --red:#c0392b; --amber:#b8860b; --card:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink);
         background:var(--bg); display:flex; justify-content:center; overscroll-behavior:none; }
  .app { width:100%; max-width:430px; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1 { margin:0; font-size:19px; }
  header small { color:var(--muted); font-size:12px; }
  nav { display:flex; gap:6px; padding:0 16px 10px; }
  nav button { flex:1; font:inherit; font-size:13px; font-weight:600; padding:8px; border-radius:999px;
               border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; }
  nav button.on { background:var(--green); border-color:var(--green); color:#fff; }
  main { flex:1; padding:0 16px 24px; }
  section[hidden] { display:none; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; background:#fff; }
  button.primary { width:100%; font:inherit; font-weight:700; padding:12px; border-radius:10px; border:0;
                   background:var(--green); color:#fff; cursor:pointer; margin-top:12px; }
  button.link { background:none; border:0; color:var(--green); font:inherit; font-weight:600; cursor:pointer; padding:0; }

  /* --- the deck ------------------------------------------------------- */
  .deck { position:relative; height:min(70vh,560px); touch-action:none; }
  .card { position:absolute; inset:0; background:var(--card); border:1px solid var(--line); border-radius:20px;
          padding:22px; box-shadow:0 10px 30px rgba(16,33,26,.10); display:flex; flex-direction:column;
          will-change:transform; cursor:grab; }
  .card.dragging { cursor:grabbing; transition:none; }
  .card.settle { transition:transform .25s ease, opacity .25s ease; }
  .card h2 { margin:0 0 4px; font-size:26px; line-height:1.15; }
  .card .place { color:var(--muted); margin:0 0 14px; font-size:15px; }
  .card .pay { font-size:22px; font-weight:800; color:var(--green); margin:0; }
  .card .count { color:var(--muted); font-size:14px; margin:2px 0 16px; }
  .card ul { list-style:none; padding:0; margin:0; flex:1; overflow:auto; }
  .card li { font-size:14px; padding:7px 0 7px 18px; border-top:1px solid var(--line); position:relative; }
  .card li::before { content:"·"; position:absolute; left:5px; color:var(--green); font-weight:800; }
  .card .via { font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; margin-top:8px; }
  .stamp { position:absolute; top:22px; font-size:20px; font-weight:800; letter-spacing:.08em; padding:6px 12px;
           border:3px solid; border-radius:10px; opacity:0; pointer-events:none; }
  .stamp.apply { right:22px; color:var(--green); border-color:var(--green); transform:rotate(12deg); }
  .stamp.skip { left:22px; color:var(--red); border-color:var(--red); transform:rotate(-12deg); }
  .stamp.save { left:50%; margin-left:-42px; color:var(--amber); border-color:var(--amber); }
  .actions { display:flex; justify-content:center; gap:18px; padding:18px 0 6px; }
  .actions button { width:62px; height:62px; border-radius:50%; border:1px solid var(--line); background:#fff;
                    font-size:24px; cursor:pointer; box-shadow:0 3px 10px rgba(16,33,26,.08); }
  .actions .go { width:70px; height:70px; font-size:28px; }
  .empty { display:grid; place-items:center; height:100%; text-align:center; color:var(--muted); padding:24px; }

  /* --- dialog --------------------------------------------------------- */
  dialog { border:0; border-radius:16px; padding:22px; max-width:340px; width:calc(100% - 40px);
           box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(16,33,26,.45); }
  dialog h3 { margin:0 0 8px; font-size:19px; }
  dialog p { margin:0 0 18px; color:var(--muted); font-size:15px; }
  .dialog-actions { display:flex; gap:10px; }
  .dialog-actions button { flex:1; font:inherit; font-weight:700; padding:11px; border-radius:10px; cursor:pointer; }
  .cancel { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .confirm { background:var(--green); border:0; color:#fff; }

  .notice { padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:12px; }
  .document-alert { cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .document-alert:active { transform:scale(.995); }
  .document-alert:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
  .document-panel { transition:box-shadow .2s ease, outline-color .2s ease; }
  .document-panel.document-focus { outline:3px solid rgba(47,132,89,.24); box-shadow:0 0 0 5px rgba(47,132,89,.08); }
  .ok { background:#e6f4ec; border:1px solid #b7dfc8; }
  .warn { background:#fdf3e3; border:1px solid #f0d9a8; }
  .err { background:#fbeae8; border:1px solid #f0c2bc; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
  .row:first-child { border-top:0; }
  .tag { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:#e7f0ea; color:var(--green); white-space:nowrap; }
  .steps { display:flex; gap:4px; margin-top:6px; }
  .steps span { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .steps span.on { background:var(--green); }
  .plan { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
  .plan b { display:block; font-size:15px; }
  .plan small { color:var(--muted); }
  .detail h2 { margin:0 0 4px; }
  .detail h4 { margin:16px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .detail img { width:100%; border-radius:12px; border:1px solid var(--line); margin-top:10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="greeting">Jobs</h1><small id="tenantLine"></small></div>
    <button class="link" id="signOut" hidden>Sign out</button>
  </header>

  <nav id="tabs" hidden>
    <button data-tab="deck" class="on">Jobs</button>
    <button data-tab="applications">My applications</button>
    <button data-tab="profile">Profile</button>
  </nav>

  <main>
    <div id="status"></div>

    <!-- registration / login ------------------------------------------ -->
    <section id="auth">
      <div class="panel">
        <strong>Sign in</strong>
        <label for="loginPhone">Phone number</label>
        <input id="loginPhone" inputmode="tel" placeholder="+255 7xx xxx xxx">
        <button class="primary" id="loginBtn">Continue</button>
        <p style="text-align:center;margin:14px 0 0;font-size:14px">
          New here? <button class="link" id="showRegister">Create an account</button>
        </p>
      </div>

      <div class="panel" id="registerPanel" hidden>
        <strong>Register</strong>
        <label for="rName">Full name</label><input id="rName">
        <label for="rPhone">Phone</label><input id="rPhone" inputmode="tel">
        <label for="rEmail">Email (optional)</label><input id="rEmail" type="email">
        <label for="rLocation">Where you live</label><input id="rLocation" placeholder="Dar es Salaam">
        <label for="rCategory">Preferred job category</label>
        <select id="rCategory">
          <option value="hospitality">Hospitality</option>
          <option value="customer_care">Customer care</option>
          <option value="driving">Driving</option>
          <option value="teaching">Teaching</option>
          <option value="security">Security</option>
          <option value="retail">Retail</option>
          <option value="construction">Construction</option>
          <option value="domestic">Domestic work</option>
          <option value="healthcare">Healthcare</option>
          <option value="it">IT</option>
          <option value="finance">Finance</option>
          <option value="sales">Sales</option>
          <option value="other">Other</option>
        </select>
        <label for="rLocations">Preferred work locations</label>
        <input id="rLocations" placeholder="Zanzibar, Dar es Salaam">
        <label for="rSalary">Minimum salary (TSh per month)</label>
        <input id="rSalary" inputmode="numeric" placeholder="500000">
        <label for="rEducation">Education</label>
        <select id="rEducation">
          <option value="none">None</option><option value="primary">Primary</option>
          <option value="secondary" selected>Secondary</option><option value="certificate">Certificate</option>
          <option value="diploma">Diploma</option><option value="degree">Degree</option>
          <option value="postgraduate">Postgraduate</option>
        </select>
        <label for="rExperience">Years of experience</label>
        <input id="rExperience" inputmode="numeric" value="0">
        <label for="rSkills">Skills</label><input id="rSkills" placeholder="Housekeeping, Guest relations">
        <label for="rLanguages">Languages</label><input id="rLanguages" placeholder="English, Swahili">
        <label><input type="checkbox" id="rRelocate" style="width:auto"> I can relocate for work</label>

        <label for="rPhoto">Profile photo</label>
        <input id="rPhoto" type="file" accept="image/jpeg,image/png,image/webp">
        <small style="display:block;color:var(--muted);margin-top:4px">Required. This photo is sent with your applications.</small>

        <label for="rCvMode">CV</label>
        <select id="rCvMode">
          <option value="create">Create my CV with Kazi</option>
          <option value="upload">Upload my existing CV</option>
        </select>
        <div id="rCvUploadBox" hidden>
          <label for="rCvFile">Upload CV (PDF)</label>
          <input id="rCvFile" type="file" accept="application/pdf">
        </div>
        <small style="display:block;color:var(--muted);margin-top:4px">You can replace your CV later from Profile.</small>

        <button class="primary" id="registerBtn">Create my account</button>
      </div>
    </section>

    <!-- deck ----------------------------------------------------------- -->
    <section id="deck" hidden>
      <div id="membershipBox"></div>
      <div class="deck" id="deckArea"></div>
      <div class="actions" id="deckActions" hidden>
        <button id="btnSkip" title="Skip">✕</button>
        <button id="btnSave" title="Save">★</button>
        <button id="btnApply" class="go" title="Apply">♥</button>
      </div>
    </section>

    <!-- applications --------------------------------------------------- -->
    <section id="applications" hidden>
      <div id="documentReminder"></div>
      <div class="panel" id="applicationList"></div>
    </section>

    <!-- profile -------------------------------------------------------- -->
    <section id="profile" hidden>
      <div class="panel" id="profileBox"></div>
      <div class="panel">
        <strong>Filters</strong>
        <label for="fCategories">Job categories</label><input id="fCategories" placeholder="hospitality, driving">
        <label for="fLocations">Locations</label><input id="fLocations" placeholder="Zanzibar, Dar es Salaam">
        <label for="fSalary">Minimum salary (TSh/month)</label><input id="fSalary" inputmode="numeric">
        <label for="fCertificate">Certificate</label>
        <select id="fCertificate">
          <option value="">Show both</option>
          <option value="false">Only jobs without certificates</option>
          <option value="true">Only jobs requiring certificates</option>
        </select>
        <button class="primary" id="saveFilters">Save filters</button>
      </div>
      <div class="panel" id="documentBox">
        <strong>Photo & documents</strong>
        <p style="font-size:13px;color:var(--muted);margin:6px 0 10px">Kazi reuses these automatically when a job asks for them.</p>
        <div id="documentList"></div>
        <label for="docKind">Add a document</label>
        <select id="docKind">
          <option value="cv">CV</option>
          <option value="certificate">Certificate / qualification</option>
          <option value="licence">Licence</option>
          <option value="identity">ID / passport</option>
          <option value="other">Other</option>
        </select>
        <label for="docFile">File</label>
        <input id="docFile" type="file" accept=".pdf,image/jpeg,image/png,image/webp">
        <label for="docLabel">Label (optional)</label>
        <input id="docLabel" placeholder="Driving licence, degree certificate">
        <button class="primary" id="uploadDocument">Save document</button>
      </div>
      <div class="panel" id="cvBox"></div>
    </section>
  </main>
</div>

<dialog id="applyDialog">
  <h3 id="applyTitle">Apply?</h3>
  <p id="applyMessage">Your CV will be shared with this employer.</p>
  <div class="dialog-actions">
    <button class="cancel" id="applyCancel">Cancel</button>
    <button class="confirm" id="applyConfirm">Apply</button>
  </div>
</dialog>

<dialog id="detailDialog"><div class="detail" id="detailBody"></div>
  <div class="dialog-actions" style="margin-top:18px"><button class="cancel" id="detailClose">Close</button></div>
</dialog>

<dialog id="packageDialog" style="max-width:760px">
  <h3 id="packageTitle">Application package</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="confirm" id="packageCv">Tailored CV</button>
    <button class="cancel" id="packageLetter">Cover letter</button>
    <button class="cancel" id="packagePrep">Interview prep</button>
  </div>
  <div id="packageMeta" style="font-size:13px;color:#5b6f66;margin-bottom:10px"></div>
  <pre id="packageBody" style="white-space:pre-wrap;font:13px/1.55 ui-monospace,monospace;max-height:55vh;overflow:auto"></pre>
  <div class="dialog-actions" style="margin-top:18px"><button class="cancel" id="packageClose">Close</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const list = (v) => v.split(',').map((s) => s.trim()).filter(Boolean);
const fileBase64 = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result || ''));
  reader.onerror = () => reject(new Error('Could not read that file.'));
  reader.readAsDataURL(file);
});

let token = localStorage.getItem('kobeos_token') || '';
let applicantId = localStorage.getItem('kobeos_applicant') || '';
let cards = [];
let pendingApply = null;
let profileData = null;
let openPackage = null;
let packageView = 'cv';
let documentState = null;
let reminderTimer = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', authorization: `Bearer ${token}`, ...(options.headers || {}) },
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data?.error?.message || `Request failed (${response.status})`);
  return data;
}

function notice(kind, text, sticky = false) {
  $('status').innerHTML = `<div class="notice ${kind}">${text}</div>`;
  if (!sticky) setTimeout(() => { $('status').innerHTML = ''; }, 6000);
}

async function uploadVaultDocument(kind, file, label = '') {
  if (!file) throw new Error('Choose a file first.');
  return api(`/api/applicants/${applicantId}/documents`, {
    method: 'POST',
    body: JSON.stringify({
      kind,
      label: label || null,
      filename: file.name,
      fileBase64: await fileBase64(file),
    }),
  });
}

async function uploadProfilePhoto(file) {
  if (!file) throw new Error('Choose a photo first.');
  return api(`/api/applicants/${applicantId}/photo`, {
    method: 'POST',
    body: JSON.stringify({ filename: file.name, fileBase64: await fileBase64(file) }),
  });
}

function countdownText(dueAt) {
  const diff = new Date(dueAt).getTime() - Date.now();
  if (diff <= 0) return 'OVERDUE';
  const totalMinutes = Math.ceil(diff / 60000);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours > 0 ? `${hours}h ${minutes}m left` : `${minutes}m left`;
}

function updateDocumentCountdowns() {
  document.querySelectorAll('[data-doc-due]').forEach((element) => {
    element.textContent = countdownText(element.dataset.docDue);
    element.classList.toggle('warn', new Date(element.dataset.docDue).getTime() - Date.now() < 6 * 60 * 60 * 1000);
  });
}

function requestReminderPermission() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then((permission) => {
    if (permission === 'granted') notice('ok', 'Document reminder alerts enabled.');
  });
}

function jumpToMissingDocuments(applicationId) {
  const panel = document.querySelector(`[data-document-panel="${CSS.escape(applicationId)}"]`);
  if (!panel) return;
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  panel.classList.add('document-focus');
  const missingRow = panel.querySelector('[data-missing-document]');
  missingRow?.focus?.({ preventScroll: true });
  setTimeout(() => panel.classList.remove('document-focus'), 1800);
}

function notifyMissingDocuments(applications) {
  const incomplete = applications.filter((entry) => !entry.documents.complete);
  const bar = $('documentReminder');
  if (incomplete.length === 0) {
    bar.innerHTML = '';
    return;
  }
  const missingCount = new Set(incomplete.flatMap((entry) =>
    entry.documents.documents.filter((doc) => !doc.satisfied).map((doc) => doc.label)
  )).size;
  const mostUrgent = [...incomplete].sort(
    (left, right) => new Date(left.documents.dueAt).getTime() - new Date(right.documents.dueAt).getTime(),
  )[0];
  const enable = 'Notification' in window && Notification.permission === 'default'
    ? '<button class="link" id="enableDocAlerts">Enable alerts</button>' : '';
  bar.innerHTML = `<div class="notice warn document-alert" id="documentAlertJump" role="button" tabindex="0"
      aria-label="Open the most urgent missing application document">
      <strong>Documents need attention.</strong>
      ${missingCount} document type(s) are still missing from active applications.
      <span class="link" style="margin-left:4px">Review now →</span> ${enable}
    </div>`;

  const openMissing = (event) => {
    if (event?.target?.id === 'enableDocAlerts') return;
    if (mostUrgent) jumpToMissingDocuments(mostUrgent.applicationId);
  };
  $('documentAlertJump')?.addEventListener('click', openMissing);
  $('documentAlertJump')?.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    openMissing(event);
  });
  $('enableDocAlerts')?.addEventListener('click', (event) => {
    event.stopPropagation();
    requestReminderPermission();
  });

  if ('Notification' in window && Notification.permission === 'granted') {
    const urgent = incomplete.find((entry) => {
      const due = new Date(entry.documents.dueAt).getTime() - Date.now();
      return due <= 12 * 60 * 60 * 1000;
    });
    if (urgent) {
      const key = `kazi_doc_alert_${urgent.applicationId}_${new Date().toISOString().slice(0, 10)}`;
      if (!sessionStorage.getItem(key)) {
        const labels = urgent.documents.documents.filter((doc) => !doc.satisfied).map((doc) => doc.label).join(', ');
        const notification = new Notification('Kazi: application documents due', {
          body: `${urgent.jobTitle}: ${labels}. ${countdownText(urgent.documents.dueAt)}.`,
        });
        notification.onclick = () => {
          window.focus();
          showTab('applications');
          requestAnimationFrame(() => jumpToMissingDocuments(urgent.applicationId));
          notification.close();
        };
        sessionStorage.setItem(key, '1');
      }
    }
  }
}

async function uploadMissingDocument(kind) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = kind === 'photo' ? 'image/jpeg,image/png,image/webp' : '.pdf,image/jpeg,image/png,image/webp';
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    try {
      if (kind === 'photo') await uploadProfilePhoto(file);
      else await uploadVaultDocument(kind, file);
      notice('ok', 'Document saved and attached to matching applications.');
      const [profile] = await Promise.all([
        api(`/api/applicants/${applicantId}`),
        loadDocuments(),
        loadApplications(),
      ]);
      profileData = profile;
      renderProfile();
    } catch (error) {
      notice('err', esc(error.message));
    }
  };
  input.click();
}

// ---------------------------------------------------------------- the deck

function renderDeck() {
  const area = $('deckArea');
  const card = cards[0];
  if (!card) {
    area.innerHTML = `<div class="empty"><div><strong>No more jobs right now.</strong>
      <p style="margin:8px 0 0">Widen your filters or check back later.</p></div></div>`;
    $('deckActions').hidden = true;
    return;
  }
  $('deckActions').hidden = false;
  area.innerHTML = `
    <div class="card" id="topCard">
      <div class="stamp apply">APPLY</div>
      <div class="stamp skip">SKIP</div>
      <div class="stamp save">SAVE</div>
      <h2>${esc(card.title)}</h2>
      <p class="place">📍 ${esc(card.location)} · ${esc(card.employerName)}</p>
      <p class="pay">💰 ${esc(card.salaryLine)}</p>
      <p class="count">👥 ${esc(card.positionsLine)}</p>
      <ul>${card.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
      <p class="via">${esc(card.postedThrough)} · tap for full details</p>
    </div>`;
  attachGestures($('topCard'), card);
}

/** Real finger swiping: drag the card, release past the threshold to act. */
function attachGestures(element, card) {
  let startX = 0, startY = 0, dx = 0, dy = 0, startedAt = 0, active = false;
  const THRESHOLD = 95;

  const paint = () => {
    element.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 22}deg)`;
    element.querySelector('.stamp.apply').style.opacity = Math.max(0, Math.min(1, dx / THRESHOLD));
    element.querySelector('.stamp.skip').style.opacity = Math.max(0, Math.min(1, -dx / THRESHOLD));
    element.querySelector('.stamp.save').style.opacity =
      Math.abs(dx) > 40 ? 0 : Math.max(0, Math.min(1, -dy / THRESHOLD));
  };

  element.addEventListener('pointerdown', (event) => {
    active = true;
    startedAt = Date.now();
    startX = event.clientX;
    startY = event.clientY;
    element.classList.add('dragging');
    element.classList.remove('settle');
    element.setPointerCapture(event.pointerId);
  });

  element.addEventListener('pointermove', (event) => {
    if (!active) return;
    dx = event.clientX - startX;
    dy = event.clientY - startY;
    paint();
  });

  const release = () => {
    if (!active) return;
    active = false;
    element.classList.remove('dragging');
    element.classList.add('settle');

    const travelled = Math.hypot(dx, dy);
    if (travelled < 10 && Date.now() - startedAt < 400) {
      element.style.transform = '';
      void openDetail(card.jobId);
      return;
    }
    if (dx > THRESHOLD) return fly(element, card, 'right', `translate(${window.innerWidth}px, ${dy}px) rotate(25deg)`);
    if (dx < -THRESHOLD) return fly(element, card, 'left', `translate(-${window.innerWidth}px, ${dy}px) rotate(-25deg)`);
    if (dy < -THRESHOLD) return fly(element, card, 'up', `translate(${dx}px, -${window.innerHeight}px)`);
    dx = 0; dy = 0;
    paint();
    element.style.transform = '';
  };

  element.addEventListener('pointerup', release);
  element.addEventListener('pointercancel', release);
}

function fly(element, card, direction, transform) {
  // A right swipe animates, then asks. Nothing is sent until Apply is pressed.
  if (direction === 'right') {
    element.style.transform = '';
    element.querySelectorAll('.stamp').forEach((stamp) => { stamp.style.opacity = 0; });
    return askToApply(card);
  }
  element.style.transform = transform;
  element.style.opacity = '0';
  setTimeout(() => void swipe(card.jobId, direction), 180);
}

async function swipe(jobId, direction, confirmed = false) {
  try {
    const outcome = await api(`/api/applicants/${applicantId}/swipes`, {
      method: 'POST',
      body: JSON.stringify({ jobId, direction, confirmed }),
    });
    if (outcome.result === 'confirm_required') { askToApplyFromPrompt(outcome.prompt); return; }
    if (outcome.result === 'applied') {
      const c = outcome.confirmation;
      const missing = outcome.documents?.documents?.filter((doc) => !doc.satisfied) ?? [];
      const documentLine = missing.length === 0
        ? 'Your application documents are complete.'
        : `Missing: ${missing.map((doc) => esc(doc.label)).join(', ')}. Submit them within 24 hours from My applications.`;
      notice(missing.length === 0 ? 'ok' : 'warn', `<strong>${esc(c.message)}</strong><br>${esc(c.position)} · ${esc(c.company)}<br>
        Application number <strong>${esc(c.applicationNumber)}</strong><br>
        ${documentLine}<br>Your tailored CV, cover letter and interview prep are ready in Applications.`, true);
      cards.shift();
    } else if (outcome.result === 'blocked') {
      const upgrade = outcome.upgradeTo
        ? ` Buy the ${esc(outcome.upgradeTo.name)} package (TSh ${outcome.upgradeTo.priceTzs.toLocaleString()}).` : '';
      notice('warn', esc(outcome.message) + upgrade, true);
      if (outcome.code === 'already_applied') cards.shift();
    } else {
      cards.shift();
    }
    renderDeck();
    if (cards.length === 0) await loadFeed();
    await Promise.all([loadApplications(), loadMembership()]);
  } catch (error) {
    notice('err', esc(error.message));
    renderDeck();
  }
}

function askToApply(card) {
  askToApplyFromPrompt({ jobId: card.jobId, title: card.title, employerName: card.employerName,
                         message: 'Your CV, photo and required documents already on file will be shared. Missing items can be added within 24 hours.' });
}

function askToApplyFromPrompt(prompt) {
  pendingApply = prompt.jobId;
  $('applyTitle').textContent = `Apply for ${prompt.title}?`;
  $('applyMessage').textContent = prompt.message;
  $('applyDialog').showModal();
}

$('applyCancel').addEventListener('click', () => { $('applyDialog').close(); pendingApply = null; renderDeck(); });
$('applyConfirm').addEventListener('click', async () => {
  $('applyDialog').close();
  const jobId = pendingApply;
  pendingApply = null;
  if (jobId) await swipe(jobId, 'right', true);
});

$('btnSkip').addEventListener('click', () => cards[0] && swipe(cards[0].jobId, 'left'));
$('btnSave').addEventListener('click', () => cards[0] && swipe(cards[0].jobId, 'up'));
$('btnApply').addEventListener('click', () => cards[0] && askToApply(cards[0]));

async function openDetail(jobId) {
  try {
    const detail = await api(`/api/applicants/${applicantId}/jobs/${jobId}`);
    const job = detail.job;
    $('detailBody').innerHTML = `
      <h2>${esc(job.title)}</h2>
      <p style="color:#5b6f66;margin:0">${esc(detail.employerName)} · ${esc(job.location)}</p>
      <p style="font-weight:700;color:#0f7a4f;font-size:19px;margin:10px 0 0">${esc(detail.salaryLine)}</p>
      <p style="color:#5b6f66;margin:2px 0 0">${detail.remainingPositions} position(s) open</p>
      ${job.description ? `<h4>About the job</h4><p style="margin:0;white-space:pre-line">${esc(job.description)}</p>` : ''}
      ${job.responsibilities.length ? `<h4>Responsibilities</h4><ul style="margin:0;padding-left:18px">${job.responsibilities.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      ${job.requirements.length ? `<h4>Requirements</h4><ul style="margin:0;padding-left:18px">${job.requirements.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      ${job.applicationDeadline ? `<h4>Deadline</h4><p style="margin:0">${esc(job.applicationDeadline)}</p>` : ''}
      <h4>Posted through</h4><p style="margin:0">${esc(detail.postedThrough)}</p>
      ${job.sourceImagePath ? `<h4>Original poster</h4><img src="${esc(job.sourceImagePath)}" alt="Original poster">` : ''}`;
    $('detailDialog').showModal();
  } catch (error) { notice('err', esc(error.message)); }
}
$('detailClose').addEventListener('click', () => $('detailDialog').close());

function prepText(prep) {
  const sections = [];
  if (prep.focusAreas?.length) sections.push('FOCUS AREAS\n' + prep.focusAreas.map((x) => `- ${x}`).join('\n'));
  if (prep.likelyQuestions?.length) sections.push('LIKELY QUESTIONS\n' + prep.likelyQuestions.map((x) => `- ${x}`).join('\n'));
  if (prep.starPrompts?.length) sections.push('STAR PRACTICE\n' + prep.starPrompts.map((x) => `- ${x}`).join('\n'));
  if (prep.questionsToAsk?.length) sections.push('QUESTIONS TO ASK\n' + prep.questionsToAsk.map((x) => `- ${x}`).join('\n'));
  if (prep.truthReminder) sections.push('IMPORTANT\n' + prep.truthReminder);
  return sections.join('\n\n');
}

function renderPackage() {
  if (!openPackage) return;
  const fit = openPackage.fit;
  $('packageMeta').textContent = `Kobe Fit ${fit.score}% · ${fit.verdict} · ${openPackage.language === 'sw' ? 'Swahili' : 'English'}`;
  $('packageBody').textContent =
    packageView === 'cv' ? openPackage.tailoredCvText :
    packageView === 'letter' ? openPackage.coverLetterText :
    prepText(openPackage.interviewPrep);
  $('packageCv').className = packageView === 'cv' ? 'confirm' : 'cancel';
  $('packageLetter').className = packageView === 'letter' ? 'confirm' : 'cancel';
  $('packagePrep').className = packageView === 'prep' ? 'confirm' : 'cancel';
}

async function openApplicationPackage(applicationId) {
  try {
    openPackage = await api(`/api/applicants/${applicantId}/applications/${applicationId}/package`);
    packageView = 'cv';
    $('packageTitle').textContent = 'Your application package';
    renderPackage();
    $('packageDialog').showModal();
  } catch (error) { notice('err', esc(error.message)); }
}

$('packageCv').addEventListener('click', () => { packageView = 'cv'; renderPackage(); });
$('packageLetter').addEventListener('click', () => { packageView = 'letter'; renderPackage(); });
$('packagePrep').addEventListener('click', () => { packageView = 'prep'; renderPackage(); });
$('packageClose').addEventListener('click', () => $('packageDialog').close());

// ------------------------------------------------------------ memberships

async function loadMembership() {
  const [view, plans] = await Promise.all([
    api(`/api/applicants/${applicantId}/membership`),
    fetch('/api/plans').then((r) => r.json()),
  ]);
  const box = $('membershipBox');
  if (view.active) {
    box.innerHTML = `<div class="notice ok"><strong>${esc(view.plan?.name ?? 'Membership')}</strong> ·
      ${view.daysRemaining} days left</div>`;
    return;
  }
  if (view.pendingPayment) {
    box.innerHTML = `<div class="notice warn">Payment <strong>${esc(view.pendingPayment.reference)}</strong>
      is waiting for the agency to confirm. You can browse while you wait.</div>`;
    return;
  }
  box.innerHTML = `<div class="panel"><strong>Choose a membership to apply</strong>
    ${plans.plans.map((plan) => `<div class="plan">
        <span><b>${esc(plan.name)}</b><small>TSh ${plan.priceTzs.toLocaleString()} · ${plan.durationDays} days</small></span>
        <button class="link" data-plan="${esc(plan.code)}">Pay</button></div>`).join('')}
    <p style="font-size:13px;color:#5b6f66;margin:12px 0 0">Pay by mobile money, then enter the transaction
      reference. The agency confirms it and your membership starts.</p></div>`;

  box.querySelectorAll('button[data-plan]').forEach((button) => {
    button.addEventListener('click', async () => {
      const plan = plans.plans.find((entry) => entry.code === button.dataset.plan);
      const reference = prompt(`Pay TSh ${plan.priceTzs.toLocaleString()} for ${plan.name}, then enter the transaction reference:`);
      if (!reference) return;
      try {
        await api(`/api/applicants/${applicantId}/payments`, {
          method: 'POST',
          body: JSON.stringify({ planCode: plan.code, amountTzs: plan.priceTzs, reference }),
        });
        notice('ok', 'Payment submitted. The agency will confirm it shortly.');
        await loadMembership();
      } catch (error) { notice('err', esc(error.message)); }
    });
  });
}

// ----------------------------------------------------------- applications

async function loadApplications() {
  const data = await api(`/api/applicants/${applicantId}/applications`);
  notifyMissingDocuments(data.applications);

  $('applicationList').innerHTML = data.applications.length === 0
    ? '<p style="color:#5b6f66;margin:0">You have not applied for anything yet.</p>'
    : data.applications.map((entry) => {
        const bundle = entry.documents;
        const missing = bundle.documents.filter((doc) => !doc.satisfied);
        const docs = `<div class="document-panel" data-document-panel="${esc(entry.applicationId)}"
            style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
            <strong style="font-size:13px">Documents ${bundle.satisfiedCount}/${bundle.requiredCount}</strong>
            <span class="tag" data-doc-due="${esc(bundle.dueAt)}">${bundle.complete ? 'Complete' : countdownText(bundle.dueAt)}</span>
          </div>
          <div style="margin-top:6px;font-size:13px">
            ${bundle.documents.map((doc) => `<div ${doc.satisfied ? '' : `data-missing-document="${esc(doc.kind)}" tabindex="-1"`}
                style="display:flex;justify-content:space-between;gap:10px;padding:4px 0">
              <span>${doc.satisfied ? '✓' : '⚠'} ${esc(doc.label)}</span>
              ${doc.satisfied
                ? (doc.filePath ? `<a class="link" href="${esc(doc.filePath)}" target="_blank">View</a>` : '<small>Ready</small>')
                : `<button class="link" data-upload-missing="${esc(doc.kind)}">Add now</button>`}
            </div>`).join('')}
          </div>
          ${missing.length ? `<small style="display:block;color:var(--muted);margin-top:6px">Submit missing items by ${new Date(bundle.dueAt).toLocaleString()}.</small>` : ''}
        </div>`;

        return `<div class="row"><span style="min-width:0;flex:1"><strong>${esc(entry.jobTitle)}</strong><br>
          <small style="color:#5b6f66">${esc(entry.employerName)} · ${esc(entry.reference)}<br>
          Applied ${new Date(entry.appliedAt).toLocaleDateString()}</small>
          <div class="steps">${[0,1,2,3].map((step) => `<span class="${entry.step >= step ? 'on' : ''}"></span>`).join('')}</div>
          <small style="color:#5b6f66">${esc(entry.statusMessage)}</small><br>
          <button class="link" data-package="${esc(entry.applicationId)}" style="margin-top:6px">CV · letter · interview prep</button>
          ${docs}
        </span><span class="tag">${esc(entry.statusLabel)}</span></div>`;
      }).join('');

  $('applicationList').querySelectorAll('[data-package]').forEach((button) => {
    button.addEventListener('click', () => void openApplicationPackage(button.dataset.package));
  });
  $('applicationList').querySelectorAll('[data-upload-missing]').forEach((button) => {
    button.addEventListener('click', () => void uploadMissingDocument(button.dataset.uploadMissing));
  });

  updateDocumentCountdowns();
  if (reminderTimer === null) reminderTimer = setInterval(updateDocumentCountdowns, 30_000);
}

// ---------------------------------------------------------------- profile

function renderProfile() {
  const { applicant, preferences, cv } = profileData;
  $('profileBox').innerHTML = `<div style="display:flex;gap:12px;align-items:center">
      ${applicant.photoPath
        ? `<img src="${esc(applicant.photoPath)}" alt="Profile photo" style="width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid var(--line)">`
        : '<div style="width:64px;height:64px;border-radius:50%;background:#e7f0ea;display:grid;place-items:center">No photo</div>'}
      <div><strong>${esc(applicant.fullName)}</strong><br><small style="color:var(--muted)">${esc(applicant.location)}</small></div>
    </div>
    <div class="row"><span>Phone</span><span>${esc(applicant.phone)}</span></div>
    <div class="row"><span>Experience</span><span>${applicant.experienceYears} year(s)</span></div>
    <div class="row"><span>Education</span><span>${esc(applicant.educationLevel)}</span></div>`;
  $('cvBox').innerHTML = `<strong>Kazi-created CV</strong>
    <p style="font-size:13px;color:#5b6f66;margin:6px 0 10px">Kazi keeps this structured CV available for matching and tailored applications. If you upload your own CV, employers receive that file too.</p>
    <pre style="white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;margin:0">${esc(cvText)}</pre>`;
  $('fCategories').value = preferences.categories.join(', ');
  $('fLocations').value = preferences.locations.join(', ');
  $('fSalary').value = preferences.minSalaryTzs ?? '';
  $('fCertificate').value = preferences.certificateRequired === null ? '' : String(preferences.certificateRequired);
  void cv;
}

function renderDocumentVault() {
  if (!documentState) return;
  const docs = documentState.documents || [];
  const cvDoc = docs.find((doc) => doc.kind === 'cv');
  const otherDocs = docs.filter((doc) => doc.kind !== 'cv');

  $('documentList').innerHTML = `
    <div class="row"><span>Profile photo</span><span>
      ${documentState.photoPath ? '<span class="tag">Ready</span>' : '<span class="tag">Missing</span>'}
      <button class="link" id="replacePhoto" style="margin-left:6px">${documentState.photoPath ? 'Replace' : 'Add'}</button>
    </span></div>
    <div class="row"><span>CV</span><span>
      <span class="tag">${cvDoc ? 'Uploaded' : 'Kazi-created'}</span>
      ${cvDoc ? `<a class="link" href="${esc(cvDoc.filePath)}" target="_blank" style="margin-left:6px">View</a>
        <button class="link" data-delete-doc="${esc(cvDoc.id)}" style="margin-left:6px">Use Kazi CV</button>` : ''}
    </span></div>
    ${otherDocs.map((doc) => `<div class="row"><span>${esc(doc.label)}<br><small style="color:var(--muted)">${esc(doc.kind)}</small></span>
      <span><a class="link" href="${esc(doc.filePath)}" target="_blank">View</a>
      <button class="link" data-delete-doc="${esc(doc.id)}" style="margin-left:6px">Remove</button></span></div>`).join('')}
  `;

  $('replacePhoto')?.addEventListener('click', () => void uploadMissingDocument('photo'));
  $('documentList').querySelectorAll('[data-delete-doc]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        await api(`/api/applicants/${applicantId}/documents/${encodeURIComponent(button.dataset.deleteDoc)}`, { method: 'DELETE' });
        await Promise.all([loadDocuments(), loadApplications()]);
        notice('ok', 'Document removed.');
      } catch (error) { notice('err', esc(error.message)); }
    });
  });
}

async function loadDocuments() {
  documentState = await api(`/api/applicants/${applicantId}/documents`);
  renderDocumentVault();
  return documentState;
}

let cvText = '';

$('uploadDocument').addEventListener('click', async () => {
  const file = $('docFile').files?.[0];
  const kind = $('docKind').value;
  try {
    await uploadVaultDocument(kind, file, $('docLabel').value.trim());
    $('docFile').value = '';
    $('docLabel').value = '';
    await Promise.all([loadDocuments(), loadApplications()]);
    notice('ok', 'Document saved. Kazi will attach it automatically when needed.');
  } catch (error) { notice('err', esc(error.message)); }
});

$('docKind').addEventListener('change', () => {
  $('docFile').accept = $('docKind').value === 'cv' ? 'application/pdf' : '.pdf,image/jpeg,image/png,image/webp';
});

$('saveFilters').addEventListener('click', async () => {
  try {
    await api(`/api/applicants/${applicantId}/preferences`, {
      method: 'PUT',
      body: JSON.stringify({
        categories: list($('fCategories').value),
        locations: list($('fLocations').value),
        minSalaryTzs: $('fSalary').value ? Number($('fSalary').value) : null,
        certificateRequired: $('fCertificate').value === '' ? null : $('fCertificate').value === 'true',
      }),
    });
    notice('ok', 'Filters saved.');
    await loadFeed();
  } catch (error) { notice('err', esc(error.message)); }
});

// ------------------------------------------------------------------ shell

async function loadFeed() {
  const data = await api(`/api/applicants/${applicantId}/feed`);
  cards = data.cards;
  renderDeck();
}

function showTab(name) {
  for (const id of ['deck', 'applications', 'profile']) $(id).hidden = id !== name;
  document.querySelectorAll('#tabs button').forEach((button) => {
    button.classList.toggle('on', button.dataset.tab === name);
  });
}
document.querySelectorAll('#tabs button').forEach((button) => {
  button.addEventListener('click', () => showTab(button.dataset.tab));
});

function listen() {
  const source = new EventSource(`/api/applicants/${applicantId}/stream?token=${encodeURIComponent(token)}`);
  source.addEventListener('application_status_changed', (event) => {
    const payload = JSON.parse(event.data);
    notice('ok', `<strong>${esc(payload.statusLabel)}</strong> — ${esc(payload.message)}`, true);
    void loadApplications();
  });
  source.addEventListener('membership_activated', () => {
    notice('ok', 'Your membership is active. You can apply now.');
    void loadMembership();
  });
  source.addEventListener('payment_rejected', (event) => {
    notice('err', `Payment ${esc(JSON.parse(event.data).reference)} was not accepted.`, true);
  });
}

async function start() {
  $('auth').hidden = true;
  $('tabs').hidden = false;
  $('signOut').hidden = false;
  const [profile, plans, cv] = await Promise.all([
    api(`/api/applicants/${applicantId}`),
    fetch('/api/plans').then((r) => r.json()),
    api(`/api/applicants/${applicantId}/cv`),
  ]);
  profileData = profile;
  cvText = cv.text;
  $('greeting').textContent = profile.applicant.fullName.split(' ')[0];
  $('tenantLine').textContent = `Jobs through ${plans.tenant}`;
  renderProfile();
  showTab('deck');
  await Promise.all([loadMembership(), loadFeed(), loadApplications(), loadDocuments()]);
  listen();
}

function saveSession(session, id) {
  token = session.token;
  applicantId = id;
  localStorage.setItem('kobeos_token', token);
  localStorage.setItem('kobeos_applicant', applicantId);
}

$('showRegister').addEventListener('click', () => { $('registerPanel').hidden = !$('registerPanel').hidden; });

$('rCvMode').addEventListener('change', () => {
  $('rCvUploadBox').hidden = $('rCvMode').value !== 'upload';
});

$('loginBtn').addEventListener('click', async () => {
  try {
    const result = await fetch('/api/applicants/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone: $('loginPhone').value.trim() }),
    }).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message); return d; });
    saveSession(result.session, result.applicantId);
    await start();
  } catch (error) { notice('err', esc(error.message || 'Could not sign in.')); }
});

$('registerBtn').addEventListener('click', async () => {
  const photo = $('rPhoto').files?.[0];
  const cvMode = $('rCvMode').value;
  const cvFile = $('rCvFile').files?.[0];

  if (!photo) {
    notice('warn', 'Add a profile photo before creating your account.', true);
    return;
  }
  if (cvMode === 'upload' && !cvFile) {
    notice('warn', 'Choose your CV PDF, or select “Create my CV with Kazi”.', true);
    return;
  }

  try {
    $('registerBtn').disabled = true;
    $('registerBtn').textContent = 'Creating account…';
    const result = await fetch('/api/applicants/register', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        fullName: $('rName').value.trim(),
        phone: $('rPhone').value.trim(),
        email: $('rEmail').value.trim() || null,
        location: $('rLocation').value.trim(),
        categories: [$('rCategory').value],
        preferredLocations: list($('rLocations').value),
        minSalaryTzs: $('rSalary').value ? Number($('rSalary').value) : null,
        educationLevel: $('rEducation').value,
        experienceYears: Number($('rExperience').value || 0),
        skills: list($('rSkills').value),
        languages: list($('rLanguages').value),
        willingToRelocate: $('rRelocate').checked,
      }),
    }).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message); return d; });

    saveSession(result.session, result.applicant.id);
    await uploadProfilePhoto(photo);
    if (cvMode === 'upload') await uploadVaultDocument('cv', cvFile, 'Uploaded CV');

    await start();
    notice('ok', cvMode === 'upload'
      ? 'Account created. Your photo and CV are ready for applications.'
      : 'Account created. Your photo is saved and Kazi created your CV.');
  } catch (error) {
    notice('err', esc(error.message || 'Could not register.'));
  } finally {
    $('registerBtn').disabled = false;
    $('registerBtn').textContent = 'Create my account';
  }
});

$('signOut').addEventListener('click', () => {
  localStorage.removeItem('kobeos_token');
  localStorage.removeItem('kobeos_applicant');
  location.reload();
});

if (token && applicantId) {
  start().catch(() => {
    localStorage.removeItem('kobeos_token');
    localStorage.removeItem('kobeos_applicant');
    $('auth').hidden = false;
  });
}
</script>
