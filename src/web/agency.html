<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soko Huru control dashboard - KobeOS</title>
<style>
  :root { --ink:#10211a; --muted:#5b6f66; --line:#d8e4dd; --bg:#f4f8f5; --green:#0f7a4f; --amber:#a86a10; --red:#b3372b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--green); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; }
  header input { padding:7px 10px; border-radius:8px; border:0; font-size:13px; min-width:200px; }
  main { max-width:1120px; margin:0 auto; padding:24px 20px 64px; display:grid; gap:20px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .grid2 { display:grid; gap:20px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  @media (max-width:860px) { .grid2 { grid-template-columns:1fr; } }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:10px 0 4px; }
  textarea, input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; background:#fff; }
  textarea { min-height:150px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  button { font:inherit; font-weight:600; cursor:pointer; border-radius:8px; border:1px solid transparent; padding:9px 14px; }
  .primary { background:var(--green); color:#fff; }
  .ghost { background:#fff; border-color:var(--line); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .field { display:grid; grid-template-columns:150px 1fr; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .field span.name { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .field input { padding:6px 8px; }
  .flag { border-left:3px solid var(--amber); padding-left:8px; }
  .log { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; max-height:240px; overflow:auto; }
  .log div { padding:4px 0; border-bottom:1px solid var(--line); }
  .notice { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:12px; }
  .ok { background:#e6f4ec; border:1px solid #b7dfc8; }
  .err { background:#fbeae8; border:1px solid #f0c2bc; }
  .chase { color:var(--red); font-weight:600; }
  code { background:#e7f0ea; padding:2px 6px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Soko Huru control dashboard</h1>
  <div><input id="key" placeholder="staff key" autocomplete="off"><button class="ghost" id="connect" style="margin-left:8px">Connect</button></div>
</header>

<main>
  <div id="status"></div>

  <div class="grid2">
    <section class="panel">
      <h2>Upload vacancy post</h2>
      <label for="channel">Source</label>
      <select id="channel">
        <option value="poster_image">Poster image</option>
        <option value="screenshot">Screenshot</option>
        <option value="whatsapp_text" selected>WhatsApp message</option>
        <option value="pasted_text">Pasted vacancy text</option>
        <option value="pdf">PDF</option>
        <option value="manual_entry">Manual entry</option>
        <option value="email">Email</option>
      </select>
      <label for="employerName">Employer client</label>
      <input id="employerName" placeholder="Zanzibar Resort">
      <label for="imagePath">Poster file path (optional)</label>
      <input id="imagePath" placeholder="/uploads/posters/....jpg">
      <label for="text">Poster text or message</label>
      <textarea id="text" placeholder="Paste the advert exactly as it went out on WhatsApp or Instagram"></textarea>
      <button class="primary" id="extract" style="margin-top:12px">Read with Kobe AI</button>
    </section>

    <section class="panel">
      <h2>Check what Kobe AI read</h2>
      <div id="review"><p style="color:#5b6f66">Upload a post to see the extracted vacancy here.</p></div>
    </section>
  </div>

  <section class="panel">
    <h2>Clients and vacancies</h2>
    <table>
      <thead><tr><th>Employer</th><th>Job</th><th class="num">Applications</th><th class="num">New</th>
        <th class="num">Hired</th><th class="num">Remaining</th><th>Client last opened</th></tr></thead>
      <tbody id="overview"><tr><td colspan="7" style="color:#5b6f66">Connect with your staff key.</td></tr></tbody>
    </table>
  </section>

  <div class="grid2">
    <section class="panel">
      <h2>Client access</h2>
      <div id="clients"></div>
    </section>
    <section class="panel">
      <h2>Live activity</h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let key = sessionStorage.getItem('kobeos_agency_key') || '';
let draft = null;

function escape(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function notice(kind, text) { $('status').innerHTML = `<div class="notice ${kind}">${text}</div>`; }

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', 'x-agency-key': key, ...(options.headers || {}) },
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data?.error?.message || `Request failed (${response.status})`);
  return data;
}

const FIELDS = ['title','employerName','location','category','positions','accommodationProvided','mealsProvided',
  'transportProvided','employmentType','workMode','genderRequirement','ageMin','ageMax','experienceYearsMin',
  'experienceNote','educationMin','certificateRequired','immediateStart','startDate','applicationDeadline'];

function renderReview(extraction) {
  const vacancy = extraction.vacancy;
  const flagged = new Set(extraction.needsReview);
  const confidence = Object.fromEntries(extraction.confidence.map((entry) => [entry.field, entry]));
  const salary = vacancy.salary;
  const rows = FIELDS.map((field) => {
    const value = vacancy[field];
    const conf = confidence[field];
    const hint = conf ? `${Math.round(conf.confidence * 100)}%` : 'not found';
    return `<div class="field ${flagged.has(field) ? 'flag' : ''}">
      <span class="name">${escape(field)}<br><small>${hint}</small></span>
      <input data-field="${field}" value="${escape(value === null || value === undefined ? '' : value)}"></div>`;
  }).join('');

  $('review').innerHTML = `
    <p style="margin:0 0 8px;font-size:13px;color:#5b6f66">Read by <code>${escape(extraction.extractor)}</code>,
       language ${escape(extraction.detectedLanguage)}.
       ${flagged.size ? `<strong style="color:#a86a10">${flagged.size} field(s) need a check.</strong>` : 'Nothing flagged.'}</p>
    <div class="field"><span class="name">languages</span>
      <input data-field="languages" value="${escape((vacancy.languages || []).join(', '))}"></div>
    <div class="field"><span class="name">salary</span>
      <input data-field="__salary" value="${salary ? escape(`${salary.currency} ${salary.amountMin ?? ''}${salary.amountMax ? '-' + salary.amountMax : ''} per ${salary.period}${salary.plusTips ? ' + tips' : ''}`) : ''}" disabled></div>
    ${rows}
    <button class="primary" id="publish" style="margin-top:14px">Publish swipe card and client page</button>`;

  $('publish').addEventListener('click', publish);
}

function collectCorrections() {
  const corrections = {};
  document.querySelectorAll('#review input[data-field]').forEach((input) => {
    const field = input.dataset.field;
    if (field.startsWith('__')) return;
    const raw = input.value.trim();
    if (field === 'languages') { corrections.languages = raw ? raw.split(',').map((s) => s.trim()).filter(Boolean) : []; return; }
    if (raw === '') { corrections[field] = null; return; }
    if (['positions','ageMin','ageMax','experienceYearsMin'].includes(field)) { corrections[field] = Number(raw); return; }
    if (['accommodationProvided','mealsProvided','transportProvided','certificateRequired','immediateStart'].includes(field)) {
      corrections[field] = raw === 'true'; return;
    }
    corrections[field] = raw;
  });
  return corrections;
}

async function publish() {
  try {
    await api(`/api/agency/drafts/${draft.id}`, { method: 'PATCH', body: JSON.stringify({ corrections: collectCorrections() }) });
    const result = await api(`/api/agency/drafts/${draft.id}/publish`, {
      method: 'POST',
      body: JSON.stringify({ employerName: $('employerName').value.trim() || null }),
    });
    const code = result.employerAccessCode
      ? `<br>One-time access code for ${escape(result.employerName)}: <strong>${escape(result.employerAccessCode.secret)}</strong>`
      : '';
    const portalPath = new URL(result.portalUrl).pathname;
    notice('ok', `Published. <a href="${escape(portalPath)}">Open ${escape(result.employerName)}'s page</a>
      · card link ${escape(result.vacancyUrl)}${code}`);
    $('review').innerHTML = '<p style="color:#5b6f66">Published. Upload the next poster.</p>';
    $('text').value = '';
    await refresh();
  } catch (error) { notice('err', escape(error.message)); }
}

async function refresh() {
  const [overview, clients] = await Promise.all([api('/api/agency/overview'), api('/api/agency/clients')]);
  $('overview').innerHTML = overview.rows.length === 0
    ? `<tr><td colspan="7" style="color:#5b6f66">No published vacancies yet.</td></tr>`
    : overview.rows.map((row) => `<tr>
        <td>${escape(row.employerName)}</td><td>${escape(row.jobTitle)}</td>
        <td class="num">${row.applications}</td><td class="num">${row.newApplications}</td>
        <td class="num">${row.hired}</td><td class="num">${row.remainingPositions}</td>
        <td>${row.employerLastSeenAt ? escape(new Date(row.employerLastSeenAt).toLocaleString()) : '<span class="chase">never opened</span>'}</td>
      </tr>`).join('');

  $('clients').innerHTML = clients.clients.map((client) => `
    <div class="field" style="grid-template-columns:1fr auto">
      <span>${escape(client.employer.name)}<br>
        <small style="color:#5b6f66">${escape(client.portalUrl || '')}</small>
        ${client.needsChasing ? '<br><span class="chase">candidates waiting, not reviewed</span>' : ''}</span>
      <button class="ghost" data-employer="${escape(client.employer.id)}">Resend access</button>
    </div>`).join('') || '<p style="color:#5b6f66">No clients yet.</p>';

  document.querySelectorAll('#clients button[data-employer]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        const issued = await api(`/api/agency/clients/${button.dataset.employer}/access`, {
          method: 'POST', body: JSON.stringify({ kind: 'one_time_code' }),
        });
        notice('ok', `New one-time code: <strong>${escape(issued.secret)}</strong> (expires ${escape(new Date(issued.expiresAt).toLocaleString())})`);
      } catch (error) { notice('err', escape(error.message)); }
    });
  });
}

function listen() {
  const source = new EventSource(`/api/agency/stream?key=${encodeURIComponent(key)}`);
  const log = $('log');
  for (const type of ['application_received','application_status_changed','vacancy_published','draft_created',
                      'more_candidates_requested','employer_access_issued','vacancy_closed']) {
    source.addEventListener(type, (event) => {
      const payload = JSON.parse(event.data);
      const line = document.createElement('div');
      line.textContent = `${new Date().toLocaleTimeString()}  ${type}  ${JSON.stringify(payload)}`;
      log.prepend(line);
      void refresh();
    });
  }
}

$('extract').addEventListener('click', async () => {
  try {
    const result = await api('/api/agency/uploads', {
      method: 'POST',
      body: JSON.stringify({
        channel: $('channel').value,
        text: $('text').value,
        imagePath: $('imagePath').value.trim() || null,
        employerName: $('employerName').value.trim() || null,
      }),
    });
    draft = result.draft;
    renderReview(result.extraction);
    notice('ok', 'Extracted. Check the flagged fields, correct anything wrong, then publish.');
  } catch (error) { notice('err', escape(error.message)); }
});

$('connect').addEventListener('click', () => {
  key = $('key').value.trim();
  sessionStorage.setItem('kobeos_agency_key', key);
  refresh().then(listen).catch((error) => notice('err', escape(error.message)));
});

if (key) { $('key').value = key; refresh().then(listen).catch(() => {}); }
</script>
</body>
</html>
