name = "kazi"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-08-22"
workers_dev = true

[[routes]]
pattern = "kazi.kobeapptz.com"
custom_domain = true

[assets]
directory = "./src/web"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "KAZI_APP"
class_name = "KaziApp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KaziApp"]

[observability]
enabled = true

