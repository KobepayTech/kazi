name: Kazi Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck Node runtime
        run: npm run typecheck

      - name: Bundle Cloudflare runtime
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist-cloudflare

      - name: Verify Cloudflare credentials exist
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy

      - name: Configure hosted Kazi secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EXPLICIT_AGENCY_KEY: ${{ secrets.KOBEOS_TENANT_KEY }}
          EXPLICIT_PUBLIC_URL: ${{ vars.KOBEOS_PUBLIC_URL }}
          PUBLIC_KAZI_URL: https://kazi.kobeapptz.com
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT_AGENCY_KEY" ]; then
            AGENCY_KEY="$EXPLICIT_AGENCY_KEY"
          else
            AGENCY_KEY="$(printf '%s' "${CLOUDFLARE_API_TOKEN}:${CLOUDFLARE_ACCOUNT_ID}:kazi-agency-v1" | sha256sum | awk '{print $1}')"
          fi
          echo "::add-mask::$AGENCY_KEY"
          printf '%s' "$AGENCY_KEY" | npx --yes wrangler@4 secret put KOBEOS_TENANT_KEY

          PUBLIC_URL="${EXPLICIT_PUBLIC_URL:-$PUBLIC_KAZI_URL}"
          printf '%s' "$PUBLIC_URL" | npx --yes wrangler@4 secret put KOBEOS_PUBLIC_URL

      - name: Seed hosted demo data
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EXPLICIT_AGENCY_KEY: ${{ secrets.KOBEOS_TENANT_KEY }}
          PUBLIC_KAZI_URL: https://kazi.kobeapptz.com
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT_AGENCY_KEY" ]; then
            AGENCY_KEY="$EXPLICIT_AGENCY_KEY"
          else
            AGENCY_KEY="$(printf '%s' "${CLOUDFLARE_API_TOKEN}:${CLOUDFLARE_ACCOUNT_ID}:kazi-agency-v1" | sha256sum | awk '{print $1}')"
          fi
          echo "::add-mask::$AGENCY_KEY"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            -X POST \
            -H "x-agency-key: $AGENCY_KEY" \
            -H "content-type: application/json" \
            --data '{"staffId":"deployment-demo-seed"}' \
            "$PUBLIC_KAZI_URL/api/agency/demo/seed"
          echo

      - name: Smoke test deployment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBLIC_KAZI_URL: https://kazi.kobeapptz.com
          FALLBACK_KAZI_URL: https://jobs.kobeapptz.com
        run: |
          set -euo pipefail
          index=0
          for URL in "$PUBLIC_KAZI_URL" "$FALLBACK_KAZI_URL"; do
            index=$((index + 1))
            curl --fail --silent --show-error --retry 12 --retry-delay 5 "$URL/health"
            curl --fail --silent --show-error --retry 12 --retry-delay 5 "$URL/" -o "/tmp/kazi-home-$index.html"
            grep -q '<title>KobeOS - swipe-to-apply recruitment</title>' "/tmp/kazi-home-$index.html"
            curl --fail --silent --show-error --retry 12 --retry-delay 5 "$URL/jobs" -o "/tmp/kazi-jobs-$index.html"
            grep -q '<title>Jobs</title>' "/tmp/kazi-jobs-$index.html"
          done
          echo
